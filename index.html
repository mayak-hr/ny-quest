<title>12 огней маяка</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --navy:#143139; --teal:#39879E; --orange:#ED7C16; --white:#fff; --grey:#F5F5F5; --mint:#E7F0EB;
  --teal-dark:#2B6A7D; --orange-dark:#C8650C; --ok:#2E7D4F; --bad:#B23A2E; --muted:#5A6E74;
  --r:22px; --r-sm:14px;
  --hand:'Neucha',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mint);color:var(--navy);font:17px/1.45 var(--body);min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
a{color:var(--teal-dark)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;gap:10px;padding:8px 14px;max-width:560px;margin:0 auto}
header.top img{width:44px;height:52px;object-fit:contain}
header.top .ttl{font-family:var(--hand);font-size:24px;line-height:1.05;flex:1}
header.top .ttl small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:999px;border:2px solid var(--navy);background:var(--orange);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;touch-action:manipulation}
.btn:focus-visible,.chip:focus-visible,.cell:focus-visible,.opt:focus-visible,.card-btn:focus-visible,.tile:focus-visible,.mem:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.sec{background:#fff;color:var(--navy)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal-dark);text-decoration:underline;min-height:44px;padding:6px 8px;font-weight:600}
.btn.small{min-height:44px;padding:6px 14px;font-size:15px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.hl{box-shadow:0 0 0 4px rgba(237,124,22,.35)}
.icon-btn{min-height:44px;min-width:44px;border-radius:999px;border:2px solid var(--navy);background:#fff;font-weight:700;padding:6px 12px;cursor:pointer;font-size:14px}
.card{background:#fff;border-radius:var(--r);padding:18px;margin:12px 0;border:2px solid rgba(20,49,57,.08)}
.card.mint{background:var(--mint)}
.card.navy{background:var(--navy);color:#fff}
h1,h2,h3{font-family:var(--hand);font-weight:400;line-height:1.1;margin:0 0 10px;letter-spacing:.3px}
h1{font-size:34px} h2{font-size:28px} h3{font-size:23px}
.caps{font-family:var(--hand);text-transform:uppercase;letter-spacing:1px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--navy);font-size:14px;font-weight:600;border:0}
.chip.orange{background:#FCE3CC} .chip.teal{background:#D5EAF0} .chip.navy{background:var(--navy);color:#fff}
.field{margin:0 0 12px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input{width:100%;min-height:52px;border-radius:var(--r-sm);border:2px solid var(--navy);padding:10px 14px;background:#fff;font-size:18px}
.field input:focus{outline:3px solid var(--teal);outline-offset:1px}
.field .hint{font-size:14px;color:var(--muted);margin-top:4px}
.msg{padding:10px 14px;border-radius:var(--r-sm);margin:10px 0;font-weight:600}
.msg.ok{background:#DDF0E4;color:var(--ok)} .msg.bad{background:#F8E0DC;color:var(--bad)} .msg.info{background:var(--mint)} .msg.warn{background:#FCE3CC;color:#7A3D05}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 auto}
.stack > * + *{margin-top:10px}
.demo-ribbon{background:var(--orange);color:#fff;text-align:center;font-weight:700;padding:6px 10px;font-size:14px}
.net-ribbon{background:var(--navy);color:#fff;text-align:center;padding:6px 10px;font-size:14px}
footer.bottom{max-width:560px;margin:0 auto;padding:8px 14px 30px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Огни на главной */
.lights{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.light{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:2px dashed #9DB3B8;color:#7D9297;background:#fff}
.light.found{border:2px solid var(--teal);color:var(--teal-dark)}
.light.done{background:var(--orange);border:2px solid var(--navy);color:#fff;box-shadow:0 0 0 5px rgba(237,124,22,.25)}
.list{display:grid;gap:10px}
.gcard{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:var(--r);padding:14px;border:2px solid rgba(20,49,57,.08);text-decoration:none;color:inherit}
.gcard .num{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px dashed #9DB3B8;color:#7D9297}
.gcard.found .num{border:2px solid var(--teal);color:var(--teal-dark)}
.gcard.done .num{background:var(--orange);color:#fff;border:2px solid var(--navy)}
.gcard .t{font-weight:700;font-size:18px}
.gcard .s{font-size:15px;color:var(--muted)}
.gcard.locked{background:#FAFBFB}
button.gcard{width:100%;text-align:left;font:inherit;cursor:pointer}

/* Общие игровые элементы */
.q{border:2px solid rgba(20,49,57,.12);border-radius:var(--r);padding:14px;margin:12px 0;background:#fff}
.q.solved{border-color:var(--ok);background:#F3FAF5}
.q.skipped{border-style:dashed;background:#FAFBFB}
.q .qtext{font-size:19px;margin-bottom:10px;white-space:pre-line}
.q .emoji{font-size:34px;line-height:1.3;letter-spacing:2px;text-align:center;margin:6px 0 4px}
.boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:4px 0 10px}
.boxes .w{display:flex;gap:2px}
.boxes .w i{width:13px;height:16px;border:1.5px solid var(--navy);border-radius:3px;display:block}
.hintbox{background:#FCE3CC;border-radius:var(--r-sm);padding:10px 12px;margin:8px 0;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confirm{background:var(--mint);border-radius:var(--r-sm);padding:10px;margin-top:8px}

/* Память */
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem{aspect-ratio:1/1.05;border-radius:var(--r-sm);border:2px solid var(--navy);background:var(--teal);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;position:relative;touch-action:manipulation}
.mem .back{width:60%;opacity:.9}
.mem.open,.mem.done{background:#fff}
.mem.done{border-color:var(--ok);background:#F3FAF5}
.mem svg.ic{width:62%;height:auto}
.mem .lb{font-size:13px;font-weight:700;margin-top:2px}

/* Пазл */
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--navy);border:3px solid var(--navy);border-radius:var(--r-sm);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.tile{display:block;padding:0;border:0;background:#fff;cursor:pointer;position:relative;aspect-ratio:4/3}
.tile svg{display:block;width:100%;height:100%}
.tile.sel{outline:4px solid var(--orange);outline-offset:-4px;z-index:1}
.tile.right::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(46,125,79,.0)}

/* Отличия */
.scene-box{position:relative;border:3px solid var(--navy);border-radius:var(--r-sm);overflow:hidden;background:#fff;margin:6px 0}
.scene-box svg{display:block;width:100%;height:auto}
.scene-label{font-weight:700;font-size:14px;margin-top:8px}
.zoomwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.zoomwrap.zoom .scene-box{width:165%}

/* Выбор */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{min-height:64px;border-radius:var(--r-sm);border:2px solid var(--navy);background:#fff;font-weight:700;font-size:18px;cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;touch-action:manipulation}
.opt.right{background:#DDF0E4;border-color:var(--ok)}
.opt.wrong{background:#F8E0DC;border-color:var(--bad)}
.opt svg{max-width:100%;height:56px}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--mint);border-radius:var(--r-sm);padding:10px;margin:8px 0}
.seq svg{height:56px;width:auto}
.seq .qm{font-family:var(--hand);font-size:40px;width:48px;text-align:center;border:2px dashed var(--navy);border-radius:10px;line-height:52px}
.progress-dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.progress-dots i{width:12px;height:12px;border-radius:50%;background:#C9D6D9;display:block}
.progress-dots i.on{background:var(--teal)} .progress-dots i.cur{background:var(--orange)}

/* Филворд */
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:10px;border:2px solid rgba(20,49,57,.25);background:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:none}
.cell.sel{background:#FCE3CC;border-color:var(--orange)}
.cell.path{background:#FFF1E3}
.cell.found{background:var(--teal);color:#fff;border-color:var(--teal-dark)}
.cell.hinted{box-shadow:0 0 0 3px var(--orange) inset}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.word{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--mint);font-weight:700}
.word.found{background:#DDF0E4;text-decoration:line-through;color:var(--ok)}

/* Лабиринт */
.maze-box{border:3px solid var(--navy);border-radius:var(--r-sm);background:#D5EAF0;overflow:hidden;max-width:420px;margin:0 auto}
.maze-box svg{display:block;width:100%;height:auto;touch-action:manipulation}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin:14px 0}
.pad button{border-radius:var(--r-sm);border:2px solid var(--navy);background:#fff;font-size:28px;font-weight:800;cursor:pointer;touch-action:manipulation}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.wiggle{animation:shake .3s}

/* Гномики */
.gnomes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gnome{background:#fff;border:2px solid rgba(20,49,57,.12);border-radius:var(--r);padding:8px;text-align:center;cursor:pointer;position:relative;font:inherit}
.gnome svg{width:100%;height:auto;max-height:180px;transform-origin:50% 90%}
.gnome .lb{font-weight:700;font-size:15px}
.bubble{background:var(--navy);color:#fff;border-radius:16px;padding:8px 10px;font-size:15px;margin-top:6px}
.dance-sway svg{animation:sway 1s ease-in-out 3}
.dance-spin svg{animation:spin 1.2s ease-in-out 2}
.dance-hop svg{animation:hop .5s ease-in-out 5}
.dance-wave svg{animation:wave .8s ease-in-out 3}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes wave{0%,100%{transform:skewX(0)}50%{transform:skewX(-7deg) translateX(4px)}}

/* Бутылки */
.sea{position:relative;background:linear-gradient(#E7F0EB 0 45%,#39879E 45% 100%);border-radius:var(--r);border:3px solid var(--navy);padding:16px 8px 22px;display:flex;justify-content:space-around;align-items:flex-end;min-height:190px;overflow:hidden}
.bottle{background:none;border:0;padding:0;cursor:pointer;width:17%;animation:bob 3s ease-in-out infinite}
.bottle:nth-child(2){animation-delay:.6s}.bottle:nth-child(3){animation-delay:1.2s}.bottle:nth-child(4){animation-delay:1.8s}.bottle:nth-child(5){animation-delay:2.4s}
.bottle svg{width:100%;height:auto}
.bottle.opened{opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.letter{background:#FFFBF2;border:2px solid var(--navy);border-radius:var(--r);padding:20px;margin:14px 0;font-size:20px;font-family:var(--hand);line-height:1.35;position:relative;animation:unroll .6s ease-out}
@keyframes unroll{from{transform:scaleY(.1);opacity:0}to{transform:scaleY(1);opacity:1}}
.beam{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(237,124,22,.18) 50%,transparent 70%);animation:sweep 2.4s ease-in-out 1}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Результат */
.result{text-align:center}
.result .big{font-family:var(--hand);font-size:56px;line-height:1;color:var(--orange)}
.save{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700;margin:10px 0}
.save .dot{width:12px;height:12px;border-radius:50%;background:#C9D6D9}
.save.saving .dot{background:var(--orange);animation:pulse 1s infinite}
.save.saved .dot{background:var(--ok)}
.save.queued .dot,.save.error .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;font-weight:800;letter-spacing:2px;background:#fff;border:3px dashed var(--orange);border-radius:var(--r-sm);padding:10px;text-align:center;margin:8px 0;user-select:all}
.grid3{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;max-width:360px;margin:8px auto}
.grid3 b{font-size:14px;text-align:center}
.grid3 button{min-height:44px;border-radius:10px;border:2px solid rgba(20,49,57,.25);background:#fff;font-size:20px;font-weight:800;cursor:pointer}
table.pts{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.pts td,table.pts th{border-bottom:1px solid #D9E3E5;padding:6px 4px;text-align:left}

/* Уменьшение движения */
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important} }
body.rm *,body.rm *::before,body.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
body.rm .bottle{animation:none}
@media (max-width:360px){ body{font-size:16px} h1{font-size:30px} .cell{font-size:17px} .pad{grid-template-columns:repeat(3,64px)} }
</style>
</head>

/* ================= Связь с сервером ================= */
function netError(msg) { const e = new Error(msg || 'net'); e.net = true; return e; }

function rawCall(req) {
  if (DEMO) return sleep(250).then(() => JSON.parse(JSON.stringify(window.MAYAK_DEMO_BACKEND.handle(req))));
  if (GAS) return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(netError(String(e)))).api(req));
  if (!API_OK) return Promise.reject(Object.assign(new Error('Сайт ещё не подключён к Google Таблице.'), { config: true }));
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 25000);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
    .then(r => { if (!r.ok) throw netError('HTTP ' + r.status); return r.json(); })
    .catch(e => { throw e && e.net ? e : netError(e && e.message); })
    .finally(() => clearTimeout(timer));
}

const RETRIABLE = ['busy', 'rate_limited', 'server_error'];
async function call(req, opts) {
  opts = opts || {};
  const tries = opts.tries == null ? 3 : opts.tries;
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const res = await rawCall(req);
      setOnline(true);
      if (res && res.ok === false && RETRIABLE.includes(res.error) && i < tries - 1) { last = res; await sleep(1500 * (i + 1)); continue; }
      return res;
    } catch (e) {
      if (e.config) throw e;
      last = e; setOnline(false);
      if (i < tries - 1) await sleep(1200 * (i + 1));
    }
  }
  if (last instanceof Error) throw last;
  return last;
}

function setOnline(v) {
  if (S.online === v) return;
  S.online = v; ribbons();
}

/* ================= Очередь неотправленных результатов ================= */
const outbox = {
  all() { return store.get('outbox', []); },
  save(list) { store.set('outbox', list); },
  add(item) { const l = outbox.all().filter(x => x.id !== item.id); l.push(item); outbox.save(l); },
  remove(id) { outbox.save(outbox.all().filter(x => x.id !== id)); },
  pendingFor(pid) { return outbox.all().filter(x => x.pid === pid); },
};
let flushing = false;
async function flushOutbox() {
  if (flushing) return; flushing = true;
  try {
    for (const item of outbox.all()) {
      let res;
      try { res = await call(item.req, { tries: 1 }); } catch (e) { break; }
      if (res && (res.ok || !RETRIABLE.includes(res.error))) {
        outbox.remove(item.id);
        if (res.ok && S.active && item.pid === S.active.pid && res.me) S.me = res.me;
        if (S.result && S.result.attemptId === item.id) { S.result.save = res.ok ? 'saved' : 'error'; S.result.server = res; renderResultSave(); }
      }
    }
  } finally { flushing = false; ribbons(); }
}
window.addEventListener('online', () => { setOnline(true); flushOutbox(); });
window.addEventListener('offline', () => setOnline(false));
setInterval(() => { if (outbox.all().length) flushOutbox(); }, 30000);

/* Визуальные элементы для «Продолжи узор» */
function patternPiece(kind, code) {
  if (kind === 'flags') {
    const map = { o: [C.o, 'tri', 'оранжевый треугольный флажок'], t: [C.t, 'rect', 'бирюзовый прямоугольный флажок'], w: [C.w, 'tri', 'белый треугольный флажок'], n: [C.n, 'rect', 'тёмно-синий прямоугольный флажок'] };
    const [col, shape, label] = map[code] || [C.g, 'rect', code];
    const sh = shape === 'tri' ? `<path d="M8 8 H40 L24 44Z" fill="${col}" ${SW}/>` : `<rect x="9" y="8" width="30" height="34" fill="${col}" ${SW}/>`;
    return `<svg viewBox="0 0 48 52" role="img" aria-label="${label}"><line x1="0" y1="8" x2="48" y2="8" ${SW}/>${sh}</svg>`;
  }
  if (kind === 'beam') {
    const ang = { up: -90, right: 0, down: 90, left: 180 }[code] || 0;
    const label = { up: 'луч вверх', right: 'луч вправо', down: 'луч вниз', left: 'луч влево' }[code] || code;
    return `<svg viewBox="0 0 56 56" role="img" aria-label="${label}"><g transform="rotate(${ang} 28 28)"><path d="M32 22 L56 10 V46 L32 34Z" fill="${C.o}" opacity=".85" stroke="${C.n}" stroke-width="2"/></g><circle cx="28" cy="28" r="9" fill="${C.t}" ${SW}/></svg>`;
  }
  if (kind === 'waves') {
    const m = String(code).match(/^(\d+)([ot])$/) || [0, 1, 't'];
    const n = Number(m[1]); const col = m[2] === 'o' ? C.o : C.t;
    const label = n + ' ' + (m[2] === 'o' ? 'оранжевых' : 'бирюзовых') + ' волн';
    let p = '';
    for (let i = 0; i < n; i++) p += `<path d="M6 ${10 + i * 12} q8 -8 16 0 q8 8 16 0 q8 -8 16 0" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 60 ${Math.max(24, n * 12 + 8)}" role="img" aria-label="${label}">${p}</svg>`;
  }
  return `<span>${esc(code)}</span>`;
}
function parsePattern(s) { const m = String(s || '').match(/^(\w+):\s*(.*)$/); return m ? { kind: m[1], seq: m[2].trim().split(/\s+/) } : null; }

function ribbons() {
  const r = $('#ribbons'); let html = '';

  else if (!GAS && !API_OK) html += `<div class="demo-ribbon">Сайт ещё не подключён к Google Таблице (адрес сервера не указан)</div>`;
  if (!S.online) html += `<div class="net-ribbon">Нет связи с сервером. Пройденные задания сохранятся на телефоне и отправятся позже.</div>`;
  const pend = S.active ? outbox.pendingFor(S.active.pid).length : 0;
  if (pend) html += `<div class="net-ribbon">Ожидают отправки: ${pend} <button class="btn small sec" data-act="flush" style="margin-left:8px">Отправить</button></div>`;
  r.innerHTML = html;
  $('#btnProgress').hidden = !S.me;
  $('#btnSwitch').hidden = !S.active;
  $('#btnMotion').textContent = 'Меньше движения: ' + (S.rm ? 'вкл' : 'выкл');
  document.body.classList.toggle('rm', !!S.rm);
  if (S.event) { $('#evTitle').textContent = S.event.title || '12 огней маяка'; document.title = S.event.title || document.title; }
}

function show(html) { app.innerHTML = html; window.scrollTo(0, 0); ribbons(); }
function msg(el, kind, text) { if (!el) return; el.innerHTML = text ? `<div class="msg ${kind}" role="status">${esc(text)}</div>` : ''; }

function go(route, push) {
  S.route = route;
  if (!GAS && !DEMO && push !== false) {
    const url = route.name === 'game' ? '?g=' + encodeURIComponent(route.slug) : location.pathname;
    try { history.pushState({ r: route }, '', url); } catch (e) { }
  }
  if (DEMO && push !== false) { try { history.replaceState(null, '', route.name === 'game' ? '#g=' + route.slug : '#'); } catch (e) { } }
  render();
}
window.addEventListener('popstate', () => { S.route = parseRoute(); render(); });
window.addEventListener('hashchange', () => { if (!DEMO) return; const r = parseRoute(); if (r.name !== S.route.name || r.slug !== S.route.slug) { S.route = r; render(); } });

function parseRoute() {
  let slug = '';
  try { slug = new URLSearchParams(location.search).get('g') || ''; } catch (e) { }
  if (!slug && location.hash.startsWith('#g=')) slug = decodeURIComponent(location.hash.slice(3));
  return slug ? { name: 'game', slug: slug.trim().toLowerCase() } : { name: 'home' };
}

/* ================= Экраны ================= */
async function render() {
  const r = S.route;
  if (r.name === 'progress') return renderProgress();
  if (r.name === 'restore') return renderRestore();
  if (r.name === 'register') return renderRegister();
  if (r.name === 'game') return openGame(r.slug);
  return renderHome();
}

function statusLine() {
  const ev = S.event; if (!ev) return '';
  if (ev.status === 'before') return `<div class="msg warn">Квест начнётся ${esc(ev.startText)} (МСК). Огоньки уже можно искать, а задания откроются в день старта.</div>`;
  if (ev.status === 'after') return `<div class="msg info">Квест завершён ${esc(ev.endText)} (МСК). Спасибо, что играли! Свой прогресс можно посмотреть в «Моём прогрессе».</div>`;
  return '';
}

        ${ev.askDept !== false ? `<div class="field"><label for="f3">Подразделение <span class="muted">(необязательно)</span></label><input id="f3" name="dept" maxlength="60"></div>` : ''}
        ${ev.eventCodeRequired ? `<div class="field"><label for="f4">Код мероприятия</label><input id="f4" name="code" maxlength="40" autocomplete="off"><div class="hint">Он есть в письме-приглашении.</div></div>` : ''}
        <div id="regMsg"></div>
        <button class="btn wide" type="submit">Поднять паруса</button>
      </form>
      <p class="muted" style="margin-top:12px">Телефон, почта и другие данные не нужны.</p>
      <button class="btn ghost" data-go="restore">Я уже играл(а) на другом телефоне</button>
    </section>`);
  const f = $('#regForm');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = f.querySelector('button[type=submit]');
    const data = Object.fromEntries(new FormData(f).entries());
    if (!data.first.trim() || !data.last.trim()) return msg($('#regMsg'), 'bad', 'Укажите имя и фамилию.');
    btn.disabled = true; msg($('#regMsg'), 'info', 'Записываем…');
    const reqId = store.get('regReq', null) || uid(); store.set('regReq', reqId);
    try {
      const res = await call({ action: 'register', first: data.first, last: data.last, dept: data.dept || '', eventCode: data.code || '', deviceId: S.deviceId, reqId });
      if (!res.ok) { btn.disabled = false; return msg($('#regMsg'), 'bad', res.message || 'Не получилось зарегистрироваться.'); }
      store.del('regReq');
      applyLogin(res);
      showCode(true);
    } catch (err) { btn.disabled = false; msg($('#regMsg'), 'bad', err.config ? err.message : 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'); }
  });
}

function applyLogin(res) {
  S.active = { pid: res.me.id, token: res.token, name: res.me.name };
  store.set('active', S.active);
  S.me = res.me; if (res.games) S.games = res.games; if (res.event) S.event = res.event;
  ribbons();
}

function showCode(afterRegister) {
  const g = S.pendingGame;
  show(`<section class="card">
    <h2>${afterRegister ? 'Вы на борту!' : 'С возвращением!'}</h2>
    <p>Ваш личный код:</p>
    <div class="codebox">${esc(S.me.code)}</div>
    <p>Запишите или сфотографируйте его. С ним можно продолжить на другом телефоне. По имени ваши результаты никто не откроет — но и код никому не показывайте.</p>
    <button class="btn wide" id="goOn">${g ? 'К заданию «' + esc(g.title) + '»' : 'Ко всем огням'}</button>
  </section>`);
  $('#goOn').onclick = () => { if (g) { S.pendingGame = null; go({ name: 'game', slug: g.slug }, false); } else go({ name: 'home' }); };
}

function renderRestore() {
  show(`<section class="card">
    <h2>Продолжить с личным кодом</h2>
    <p>Код выдаётся при первой регистрации и виден в «Моём прогрессе» на том телефоне.</p>
    <form id="rf" novalidate>
      <div class="field"><label for="rc">Личный код</label><input id="rc" placeholder="Например, ЧАЙКА-4827" autocomplete="off" autocapitalize="characters" maxlength="20"></div>
      <div id="rMsg"></div>
      <button class="btn wide" type="submit">Продолжить</button>
    </form>
    <p class="muted" style="margin-top:10px">Потеряли код? ${esc((S.event && S.event.contact) || 'Организатор')} подскажет его.</p>
    <button class="btn ghost" data-go="register">Я здесь впервые</button>
  </section>`);
  $('#rf').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('#rc').value;
    msg($('#rMsg'), 'info', 'Проверяем…');
    try {
      const res = await call({ action: 'restore', code, deviceId: S.deviceId }, { tries: 1 });
      if (!res.ok) return msg($('#rMsg'), 'bad', res.message);
      applyLogin(res);
      showCode(false);
    } catch (err) { msg($('#rMsg'), 'bad', 'Нет связи с сервером. Попробуйте ещё раз.'); }

}

function renderProgress() {
  const me = S.me;
  if (!me) return go({ name: 'register' }, false);
  const rows = S.games.map(g => `<tr><td>${g.n}. ${esc(g.title)}</td><td>${g.done ? '✓' : g.found ? 'найдено' : '—'}</td><td>${g.kind === 'points' ? (g.found ? (g.best || 0) + '/' + g.max : '') : (g.done ? 'участие' : '')}</td></tr>`).join('');
  const pend = outbox.pendingFor(me.id).length;
  show(`<section class="card">
    <h2>Мой прогресс</h2>
    <p><b>${esc(me.name)}</b>${me.dept ? ' · ' + esc(me.dept) : ''}</p>
    <p class="chips"><span class="chip orange">Баллы: ${me.total} из ${me.max}</span><span class="chip teal">Завершено: ${me.done} из 12</span><span class="chip">Найдено QR: ${me.found}</span></p>
    ${pend ? `<div class="msg warn">Ещё не отправлено на сервер: ${pend}. Отправим, как только появится связь.</div>` : ''}
    <table class="pts"><thead><tr><th>Задание</th><th>Статус</th><th>Баллы</th></tr></thead><tbody>${rows}</tbody></table>
    <p>Ваш личный код — для продолжения на другом телефоне:</p>

    <div class="row"><button class="btn sec" data-act="refresh">Обновить</button><button class="btn sec" data-act="switch">Это не я / сменить участника</button></div>
  </section>`);
}

/* ================= Задание: загрузка и общий каркас ================= */
async function openGame(slug) {
  show(`<div class="card"><p>Открываем огонёк…</p></div>`);
  let res;
  const cacheKey = pkey('g.' + slug);
  try {
    res = await call({ action: 'open', slug, token: S.active && S.active.token });
  } catch (e) {
    const cached = store.get(cacheKey, null);
    if (cached) { res = Object.assign({}, cached, { offline: true }); }
    else return show(`<div class="card"><h2>Нет связи</h2><p>${e.config ? esc(e.message) : 'Не получилось загрузить задание. Проверьте интернет и обновите страницу.'}</p><button class="btn" onclick="location.reload()">Обновить</button></div>`);
  }
  if (!res.ok) {
    if (res.error === 'bad_token') { logout(); return openGame(slug); }
    return show(`<div class="card"><h2>Огонёк не найден</h2><p>${esc(res.message)}</p><button class="btn" data-go="home">Все огни</button></div>`);
  }
  if (res.event) S.event = res.event;
  if (!S.active || !res.state) { S.pendingGame = res.game; return renderRegister(res.game); }
  if (res.me) S.me = res.me;
  if (!res.offline) store.set(cacheKey, { ok: true, game: res.game, state: res.state, event: res.event });
  const lg = S.games.find(x => x.n === res.game.n);
  if (lg) { lg.found = true; lg.slug = res.game.slug; }
  S.game = res.game; S.gstate = res.state; S.result = null;
  renderGame();
}

function playKey() { return pkey('play.' + S.game.n); }
function getPlay() {
  let p = store.get(playKey(), null);
  if (!p || p.ver !== S.game.version) { p = { attemptId: 'a' + uid().slice(0, 24), ver: S.game.version, local: {}, skipped: [] }; store.set(playKey(), p); }
  return p;
}
function savePlay(p) { store.set(playKey(), p); }
function newAttempt() { store.del(playKey()); S.result = null; renderGame(); }

function renderGame() {
  const g = S.game, st = S.gstate;
  const ev = S.event || {};
  const closed = ev.status !== 'open' && !(ev.status === 'after' && false);
  const pts = g.kind === 'points' ? `до ${g.max} баллов` : 'отметка об участии';
  const done = st && st.done;
  show(`${statusLine()}
    <section class="card">
      <p class="caps" style="color:var(--orange);margin:0">Огонёк №${g.n}</p>
      <h1>${esc(g.title)}</h1>
      <div class="chips"><span class="chip">⏱ ${esc(g.minutes)} мин</span><span class="chip orange">${pts}</span>${done ? `<span class="chip teal">Уже пройдено · лучший результат ${g.kind === 'points' ? st.best + '/' + g.max : '✓'}</span>` : ''}</div>
      <p>${esc(g.intro)}</p>
      <p class="muted">${esc(g.how)}</p>
      ${!g.active ? '<div class="msg warn">Это задание сейчас закрыто организатором.</div>' : g.blocked ? '<div class="msg warn">Задание обновляется. Загляните чуть позже.</div>' : ''}
    </section>
    <section id="stage"></section>
    <div id="gameMsg"></div>`);
  if (!g.active || g.blocked) return;
  if (closed) { $('#stage').innerHTML = `<div class="card"><p>${ev.status === 'before' ? 'Задание откроется в день старта.' : 'Квест завершён — задания больше не принимают ответы.'}</p></div>`; return; }
  const engine = ENGINES[g.type];
  if (!engine) { $('#stage').innerHTML = '<div class="card">Неизвестный тип задания.</div>'; return; }
  engine($('#stage'), g, st, getPlay());
}

/* Завершение попытки: отправка с подтверждением сервера */
async function finishAttempt(payload, localSummary) {
  const g = S.game; const play = getPlay();
  const req = { action: 'finish', token: S.active.token, game: g.n, attemptId: play.attemptId, payload };
  S.result = { attemptId: play.attemptId, save: 'saving', local: localSummary || '', server: null, game: g };
  store.del(playKey());
  renderResult();
  try {
    const res = await call(req);
    if (res.ok) { S.result.save = 'saved'; S.result.server = res; S.me = res.me; S.gstate = res.state; updateListFromState(res); }
    else if (RETRIABLE.includes(res.error)) { outbox.add({ id: play.attemptId, pid: S.active.pid, req, created: Date.now() }); S.result.save = 'queued'; }
    else { S.result.save = 'error'; S.result.server = res; }
  } catch (e) {
    outbox.add({ id: play.attemptId, pid: S.active.pid, req, created: Date.now() });
    S.result.save = 'queued';
  }
  renderResult();
}

function updateListFromState(res) {
  const lg = S.games.find(x => x.n === res.game);
  if (lg) { lg.done = true; lg.found = true; lg.best = res.score; }
}

function renderResult() {
  const r = S.result, g = r.game;
  const sv = r.server && r.server.ok ? r.server : null;
  const scoreLine = g.kind === 'points'
    ? (sv ? `<div class="big">${sv.score}<span style="font-size:28px"> / ${g.max}</span></div><p>баллов за задание (в зачёт идёт лучший результат)</p>` : `<div class="big">…</div><p>баллы подтвердит сервер</p>`)
    : `<div class="big">✓</div><p>отметка об участии</p>`;
  $('#stage').innerHTML = `<section class="card result" id="resultCard">
    <h2>${sv || r.save !== 'error' ? 'Огонёк зажжён!' : 'Не получилось сохранить'}</h2>
    <p>${esc(g.success)}</p>
    ${r.local ? `<p class="muted">Результат: ${esc(sv ? sv.result || r.local : r.local)}</p>` : ''}
    ${scoreLine}
    <div id="saveLine"></div>
    <div class="row" style="margin-top:10px"><button class="btn sec" data-act="again">Сыграть ещё раз</button><button class="btn" data-go="home">Все огни</button></div>
  </section>`;
  renderResultSave();
  $('#resultCard').scrollIntoView({ block: 'start' });
}

function renderResultSave() {
  const el = $('#saveLine'); if (!el || !S.result) return;
  const s = S.result.save;
  const text = { saving: 'Сохраняем результат…', saved: 'Результат сохранён ✓', queued: 'Нет связи. Результат сохранён на телефоне и отправится автоматически.', error: (S.result.server && S.result.server.message) || 'Сервер не принял результат.' }[s];
  el.innerHTML = `<div class="save ${s}" role="status"><span class="dot"></span><span>${esc(text)}</span></div>${s === 'queued' ? '<button class="btn small sec" data-act="flush">Отправить сейчас</button>' : ''}`;
  if (s === 'saved' && S.result.server) {
    const sv = S.result.server; const card = $('#resultCard');
    const big = card && card.querySelector('.big');
    if (big && S.result.game.kind === 'points') big.innerHTML = `${sv.score}<span style="font-size:28px"> / ${S.result.game.max}</span>`;
  }
}

/* Ответ на вопрос (проверяет сервер) */
async function sendAnswer(item, value, reqId) {
  return call({ action: 'answer', token: S.active.token, game: S.game.n, item, value, reqId });
}
async function askHint(item, extra) {
  return call(Object.assign({ action: 'hint', token: S.active.token, game: S.game.n, item }, extra || {}));
}
function netFail(el, e) { msg(el, 'bad', e && e.config ? e.message : 'Нет связи с сервером — ответ не отправлен. Попробуйте ещё раз.'); }
function inlineConfirm(btn, text, onYes) {
  const box = document.createElement('div'); box.className = 'confirm';
  box.innerHTML = `<p style="margin:0 0 8px">${esc(text)}</p><div class="row"><button class="btn small" data-y>Да, открыть</button><button class="btn small sec" data-n>Отмена</button></div>`;
  btn.replaceWith(box);
  box.querySelector('[data-n]').onclick = () => box.replaceWith(btn);
  box.querySelector('[data-y]').onclick = () => { box.replaceWith(btn); onYes(); };
}

/* ================= Механики ================= */
const ENGINES = {};

/* 1, 2: загадки и шифры */
ENGINES.riddles = function (stage, g, st, play) {
  const items = st.items;
  function card(q, i) {
    const it = items[q.id];
    const solved = it.res === 'ok';
    const skipped = !solved && play.skipped.includes(q.id);
    const emoji = /\p{Extended_Pictographic}/u.test(q.text) && q.text.replace(/[\p{Extended_Pictographic}️⃣‍\s\d➕➡]/gu, '') === '';
    const boxes = q.pattern ? `<div class="boxes" aria-label="Слов: ${q.pattern.split(/\s+/).length}, букв: ${esc(q.pattern)}">${q.pattern.split(/\s+/).map(n => `<span class="w">${'<i></i>'.repeat(Number(n) || 0)}</span>`).join('')}</div>` : '';
    const hintBtn = q.hints > 0 && !it.h ? `<button class="btn small sec ${it.w >= 3 ? 'hl' : ''}" data-hint="${q.id}">Подсказка (−${q.points - (q.hintPoints[0] == null ? q.points - 1 : q.hintPoints[0])} балл)</button>` : '';
    return `<div class="q ${solved ? 'solved' : ''} ${skipped ? 'skipped' : ''}" id="q-${q.id}">
      <p class="muted" style="margin:0">Вопрос ${i + 1} из ${g.questions.length}${solved ? ` · ✓ +${it.pts}` : ''}</p>
      ${emoji ? `<div class="emoji" aria-label="Шифр из смайликов">${esc(q.text)}</div>` : `<div class="qtext">${esc(q.text)}</div>`}
      ${boxes}
      ${it.hints.map(h => `<div class="hintbox">Подсказка: ${esc(h)}</div>`).join('')}
      ${solved ? `<div class="msg ok">Верно${it.answer ? ': ' + esc(it.answer) : ''}!</div>` : skipped ? `<p class="muted">Пропущено — можно вернуться при повторе.</p><button class="btn small sec" data-unskip="${q.id}">Вернуться к вопросу</button>` : `
        <form data-form="${q.id}" novalidate class="stack">
          <div class="field" style="margin:0"><label class="sr" for="in-${q.id}">Ваш ответ</label><input id="in-${q.id}" maxlength="100" autocomplete="off" autocapitalize="none" placeholder="Ваш ответ"></div>
          <div class="row"><button class="btn" type="submit">Проверить</button>${hintBtn}<button class="btn ghost" type="button" data-skip="${q.id}">Пропустить</button></div>
          <div data-msg="${q.id}"></div>
        </form>`}
    </div>`;
  }
  function draw() {
    stage.innerHTML = g.questions.map(card).join('') + `<div id="rdone"></div>`;
    const allResolved = g.questions.every(q => items[q.id].res === 'ok' || play.skipped.includes(q.id));
    if (allResolved) {
      const solved = g.questions.filter(q => items[q.id].res === 'ok').length;
      $('#rdone').innerHTML = `<button class="btn wide" id="rfin">Зажечь огонёк</button>`;
      $('#rfin').onclick = () => finishAttempt({ skipped: play.skipped.slice() }, 'решено ' + solved + ' из ' + g.questions.length);
    }
    $$('form[data-form]', stage).forEach(f => f.addEventListener('submit', onSubmit));
    $$('[data-hint]', stage).forEach(b => b.onclick = () => inlineConfirm(b, 'Подсказка уменьшит баллы за этот вопрос. Открыть?', () => onHint(b.dataset.hint)));
    $$('[data-skip]', stage).forEach(b => b.onclick = () => { play.skipped.push(b.dataset.skip); savePlay(play); draw(); });
    $$('[data-unskip]', stage).forEach(b => b.onclick = () => { play.skipped = play.skipped.filter(x => x !== b.dataset.unskip); savePlay(play); draw(); });
  }
  async function onSubmit(e) {
    e.preventDefault();
    const id = e.target.dataset.form; const inp = $('#in-' + id, stage); const m = $(`[data-msg="${id}"]`, stage);
    const v = inp.value.trim(); if (!v) return msg(m, 'bad', 'Введите ответ.');
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; msg(m, 'info', 'Проверяем…');
    try {
      const res = await sendAnswer(id, v, uid());
      btn.disabled = false;
      if (!res.ok) return msg(m, 'bad', res.message);
      items[id] = res.item;
      if (res.correct) { draw(); maybeAutoFinish(); }
      else {
        if (res.item.w >= 3) draw(); // подсветить кнопку подсказки
        const m2 = $(`[data-msg="${id}"]`, stage), inp2 = $('#in-' + id, stage), q = $('#q-' + id, stage);
        msg(m2, 'bad', 'Пока не то. Попробуйте ещё — попытки не ограничены.');
        if (inp2) { inp2.value = v; inp2.select(); }
        if (q) { q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake'); }
      }
    } catch (err) { btn.disabled = false; netFail(m, err); }
  }
  async function onHint(id) {
    const m = $(`[data-msg="${id}"]`, stage);
    try { const res = await askHint(id); if (!res.ok) return msg(m, 'bad', res.message); items[id] = res.item; draw(); }
    catch (err) { netFail(m, err); }
  }
  function maybeAutoFinish() { /* итог подтверждаем кнопкой «Зажечь огонёк», чтобы участник видел последний ответ */ }
  draw();
};

/* 10: финальная загадка с тремя подсказками */
ENGINES.final = function (stage, g, st, play) {
  const q = g.questions[0];
  let it = st.items[q.id];
  const grid = (g.data && g.data.grid) || { rows: [], cols: [] };
  play.local.marks = play.local.marks || {};
  const ladder = [q.points].concat(q.hintPoints);
  function draw() {
    const solved = it.res === 'ok', shown = it.res === 'shown';
    const marks = play.local.marks;
    stage.innerHTML = `<div class="q ${solved ? 'solved' : ''}">
      <div class="qtext">${esc(q.text)}</div>
      <table class="pts"><tr><th>Подсказок</th>${ladder.map((_, i) => `<th>${i}</th>`).join('')}</tr><tr><td>Баллы</td>${ladder.map((p, i) => `<td${i === (it.h || 0) && !solved && !shown ? ' style="font-weight:800;color:var(--orange)"' : ''}>${p}</td>`).join('')}</tr></table>
      <p class="muted" style="margin:8px 0 0">Черновик (касание: ✗ → ✓ → пусто). На баллы не влияет.</p>
      <div class="grid3"><b></b>${grid.cols.map(c => `<b>${esc(c)}</b>`).join('')}${grid.rows.map(r => `<b style="text-align:left">${esc(r)}</b>${grid.cols.map(c => { const k = r + '|' + c; return `<button data-mark="${esc(k)}" aria-label="${esc(r)} — ${esc(c)}">${marks[k] === 1 ? '✗' : marks[k] === 2 ? '✓' : ''}</button>`; }).join('')}`).join('')}</div>
      ${it.hints.map((h, i) => `<div class="hintbox">Подсказка ${i + 1}: ${esc(h)}</div>`).join('')}
      ${solved ? `<div class="msg ok">Верно: ${esc(it.answer || '')}! +${it.pts}</div>${it.explanation ? `<p class="muted">${esc(it.explanation)}</p>` : ''}<button class="btn wide" id="ffin">Зажечь огонёк</button>`
        : shown ? `<div class="msg info">Ответ: ${esc(it.answer)}. ${esc(it.explanation || '')}</div><button class="btn wide" id="ffin">Зажечь огонёк</button>`
        : `<form id="ff" novalidate class="stack"><div class="field" style="margin:0"><label for="fin">Ваш ответ</label><input id="fin" maxlength="100" autocomplete="off"></div>
          <div class="row"><button class="btn" type="submit">Проверить</button>${(it.h || 0) < q.hints ? `<button class="btn small sec" type="button" id="fh">Подсказка ${(it.h || 0) + 1} (станет ${ladder[(it.h || 0) + 1]} б.)</button>` : `<button class="btn small sec" type="button" id="fs">Показать решение (0 баллов)</button>`}</div><div id="fm"></div></form>`}
    </div>`;
    $$('[data-mark]', stage).forEach(b => b.onclick = () => { const k = b.dataset.mark; marks[k] = ((marks[k] || 0) + 1) % 3; savePlay(play); b.textContent = marks[k] === 1 ? '✗' : marks[k] === 2 ? '✓' : ''; });
    const fin = $('#ffin', stage); if (fin) fin.onclick = () => finishAttempt({}, solved ? 'решено, подсказок: ' + (it.h || 0) : 'решение показано');
    const f = $('#ff', stage);
    if (f) f.addEventListener('submit', async e => {
      e.preventDefault(); const v = $('#fin').value.trim(); if (!v) return msg($('#fm'), 'bad', 'Введите ответ.');
      msg($('#fm'), 'info', 'Проверяем…');
      try { const res = await sendAnswer(q.id, v, uid()); if (!res.ok) return msg($('#fm'), 'bad', res.message); it = res.item; if (res.correct) draw(); else msg($('#fm'), 'bad', 'Смотритель заглянул в термос — нет, не то. Попробуйте ещё.'); }
      catch (err) { netFail($('#fm'), err); }
    });
    const fh = $('#fh', stage); if (fh) fh.onclick = () => inlineConfirm(fh, `Подсказка ${(it.h || 0) + 1}: баллы за загадку станут ${ladder[(it.h || 0) + 1]}. Открыть?`, async () => {
      try { const res = await askHint(q.id); if (!res.ok) return msg($('#fm'), 'bad', res.message); it = res.item; draw(); } catch (err) { netFail($('#fm'), err); }
    });
    const fs = $('#fs', stage); if (fs) fs.onclick = () => inlineConfirm(fs, 'Показать решение? Задание будет засчитано как пройденное, но без баллов.', async () => {
      try { const res = await call({ action: 'reveal', token: S.active.token, game: g.n }); if (!res.ok) return msg($('#fm'), 'bad', res.message); it = Object.assign({}, it, { res: 'shown', answer: res.shown[0].answer, explanation: res.shown[0].explanation, pts: 0 }); draw(); } catch (err) { netFail($('#fm'), err); }
    });
  }
  draw();
};

/* 3: память */
ENGINES.memory = function (stage, g, st, play) {
  const pairs = (g.data && g.data.pairs) || [];
  const L = play.local;
  if (!L.order) {
    const deck = pairs.flatMap(p => [p.id, p.id]);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    L.order = deck; L.matched = []; L.open = []; L.moves = 0; savePlay(play);
  }
  const label = id => (pairs.find(p => p.id === id) || {}).label || id;
  function draw() {
    stage.innerHTML = `<div class="card"><p class="chips"><span class="chip">Ходов: ${L.moves}</span><span class="chip teal">Найдено пар: ${L.matched.length} из ${pairs.length}</span></p>
      <div class="mem-grid">${L.order.map((id, i) => { const isOpen = L.open.includes(i) || L.matched.includes(id); return `<button class="mem ${L.matched.includes(id) ? 'done' : isOpen ? 'open' : ''}" data-i="${i}" aria-label="${isOpen ? label(id) : 'Закрытая карточка ' + (i + 1)}">${isOpen ? icon(id) + `<span class="lb">${esc(label(id))}</span>` : BACK}</button>`; }).join('')}</div></div>`;
    $$('.mem', stage).forEach(b => b.onclick = () => flip(Number(b.dataset.i)));
  }
  function flip(i) {
    const id = L.order[i];
    if (L.matched.includes(id) || L.open.includes(i)) return;
    if (L.open.length === 2) L.open = [];
    L.open.push(i);
    if (L.open.length === 2) {
      L.moves++;
      const [a, b] = L.open;
      if (L.order[a] === L.order[b]) { L.matched.push(L.order[a]); L.open = []; }
    }
    savePlay(play); draw();
    if (L.matched.length === pairs.length) setTimeout(() => finishAttempt({ pairs: pairs.length, moves: L.moves }, 'все пары за ' + L.moves + ' ходов'), 500);
  }
  draw();
};

/* 4: пазл 3×3, обмен касаниями или перетаскиванием */
ENGINES.puzzle = function (stage, g, st, play) {
  const n = (g.data && g.data.size) || 3; const N = n * n;
  const L = play.local;
  if (!L.order) {
    let o;
    do { o = Array.from({ length: N }, (_, i) => i); for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } } while (o.some((v, i) => v === i));
    L.order = o; L.swaps = 0; savePlay(play);
  }
  let sel = null, showRef = false;
  const W = 320 / n, H = 240 / n;
  const sceneInner = bayScene('a').replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  const tileSvg = k => `<svg viewBox="${(k % n) * W} ${Math.floor(k / n) * H} ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${sceneInner}</svg>`;
  function draw() {
    const right = L.order.filter((v, i) => v === i).length;
    stage.innerHTML = `<div class="card"><p class="chips"><span class="chip">Обменов: ${L.swaps}</span><span class="chip teal">На месте: ${right} из ${N}</span></p>
      ${showRef ? `<div class="scene-box">${bayScene('a')}</div>` : `<div class="puz" id="puz">${L.order.map((k, i) => `<button class="tile ${sel === i ? 'sel' : ''}" data-i="${i}" aria-label="Кусочек ${i + 1}${sel === i ? ', выбран' : ''}">${tileSvg(k)}</button>`).join('')}</div>`}
      <div class="row" style="margin-top:10px"><button class="btn sec small" id="ref">${showRef ? 'Вернуться к пазлу' : 'Посмотреть образец'}</button></div></div>`;
    $('#ref', stage).onclick = () => { showRef = !showRef; draw(); };
    if (showRef) return;
    $$('.tile', stage).forEach(b => {
      b.onclick = () => tap(Number(b.dataset.i));
      b.addEventListener('pointerdown', e => { dragFrom = Number(b.dataset.i); dragMoved = false; startX = e.clientX; startY = e.clientY; });
    });
  }
  let dragFrom = null, dragMoved = false, startX = 0, startY = 0;
  stage.addEventListener('pointermove', e => { if (dragFrom != null && Math.hypot(e.clientX - startX, e.clientY - startY) > 12) dragMoved = true; });
  stage.addEventListener('pointerup', e => {
    if (dragFrom == null) return;
    const from = dragFrom; dragFrom = null;
    if (!dragMoved) return; // это было касание — обработает click
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest('.tile');
    if (t) { const to = Number(t.dataset.i); if (to !== from) { swap(from, to); suppressClick = true; setTimeout(() => suppressClick = false, 50); } }
  });
  let suppressClick = false;
  function tap(i) {
    if (suppressClick) return;
    if (sel == null) { sel = i; draw(); return; }
    if (sel === i) { sel = null; draw(); return; }
    swap(sel, i);
  }
  function swap(a, b) {
    [L.order[a], L.order[b]] = [L.order[b], L.order[a]]; L.swaps++; sel = null; savePlay(play); draw();
    if (L.order.every((v, i) => v === i)) setTimeout(() => finishAttempt({ order: L.order.slice(), swaps: L.swaps }, 'собрано за ' + L.swaps + ' обменов'), 400);
  }
  draw();
};

/* 5: найди отличия */
ENGINES.diff = function (stage, g, st, play) {
  const zones = (g.data && g.data.zones) || [];
  const L = play.local;
  L.found = L.found || []; // [{id,x,y}]
  const items = st.items;
  let zoom = false, hl = null, misses = [];
  const isDone = id => L.found.some(f => f.id === id) || (items[id] && items[id].res === 'ok');
  const isShown = id => items[id] && items[id].res === 'shown';
  function overlay() {
    let s = '';
    zones.forEach(z => {
      if (isDone(z.id)) s += `<circle cx="${z.x}" cy="${z.y}" r="${z.r}" fill="none" stroke="${C.o}" stroke-width="4"/>`;
      else if (isShown(z.id)) s += `<circle cx="${z.x}" cy="${z.y}" r="${z.r}" fill="none" stroke="${C.n}" stroke-width="3" stroke-dasharray="6 5"/>`;
    });
    if (hl) s += `<rect x="${hl.x}" y="${hl.y}" width="160" height="120" fill="${C.o}" opacity=".18" stroke="${C.o}" stroke-width="3"/>`;
    misses.forEach(m => { s += `<circle cx="${m.x}" cy="${m.y}" r="9" fill="none" stroke="#7D9297" stroke-width="2"/>`; });
    return s;
  }
  const withOverlay = v => bayScene(v).replace('</svg>', `<g id="ov-${v}">${overlay()}</g></svg>`);
  function draw() {
    const cnt = zones.filter(z => isDone(z.id) || isShown(z.id)).length;
    stage.innerHTML = `<div class="card">
      <p class="chips"><span class="chip teal">Найдено: ${zones.filter(z => isDone(z.id)).length} из ${zones.length}</span><span class="chip">Подсказка: −1 балл за отличие</span></p>
      <div class="zoomwrap ${zoom ? 'zoom' : ''}"><div class="scene-label">Было</div><div class="scene-box" data-v="a">${withOverlay('a')}</div><div class="scene-label">Стало — касайтесь отличий здесь</div><div class="scene-box" data-v="b">${withOverlay('b')}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn sec small" id="dz">${zoom ? 'Обычный размер' : 'Увеличить'}</button><button class="btn sec small" id="dh">Подсказка (−1 балл)</button><button class="btn ghost" id="dr">Показать оставшиеся</button></div>
      <div id="dm"></div>
      ${cnt === zones.length ? '<button class="btn wide" id="dfin" style="margin-top:10px">Зажечь огонёк</button>' : ''}
    </div>`;
    $$('.scene-box', stage).forEach(box => box.addEventListener('click', e => onTap(e, box)));
    $('#dz', stage).onclick = () => { zoom = !zoom; draw(); };
    $('#dh', stage).onclick = e => inlineConfirm(e.target, 'Подсказка подсветит четверть картинки с одним из отличий. За это отличие будет 1 балл вместо 2. Открыть?', onHint);
    $('#dr', stage).onclick = e => inlineConfirm(e.target, 'Показать все оставшиеся отличия? За показанные баллов не будет.', onReveal);
    const fin = $('#dfin', stage);
    if (fin) fin.onclick = () => finishAttempt({ found: L.found }, 'найдено ' + zones.filter(z => isDone(z.id)).length + ' из ' + zones.length);
  }
  function onTap(e, box) {
    const svg = box.querySelector('svg'); const r = svg.getBoundingClientRect();
    const x = (e.clientX - r.left) * 320 / r.width, y = (e.clientY - r.top) * 240 / r.height;
    const hit = zones.filter(z => !isDone(z.id) && !isShown(z.id) && Math.hypot(x - z.x, y - z.y) <= z.r + 6).sort((a, b) => Math.hypot(x - a.x, y - a.y) - Math.hypot(x - b.x, y - b.y))[0];
    if (hit) { L.found.push({ id: hit.id, x: Math.round(x), y: Math.round(y) }); if (hl) hl = null; savePlay(play); misses = []; draw(); msg($('#dm'), 'ok', 'Есть! ' + (g.questions.find(q => q.id === hit.id) || {}).text); }
    else { misses = [{ x, y }]; $$('[id^=ov-]', stage).forEach(o => o.innerHTML = overlay()); }
  }
  async function onHint() {
    try {
      const res = await askHint(null, { found: L.found.map(f => f.id) });
      if (!res.ok) return msg($('#dm'), 'bad', res.message);
      if (res.none) return msg($('#dm'), 'info', res.message);
      items[res.itemId] = res.item;
      const z = zones.find(x => x.id === res.itemId);
      hl = { x: z.x < 160 ? 0 : 160, y: z.y < 120 ? 0 : 120 };
      draw(); msg($('#dm'), 'info', 'Отличие где-то в подсвеченной четверти.');
    } catch (err) { netFail($('#dm'), err); }
  }
  async function onReveal() {
    try {
      const res = await call({ action: 'reveal', token: S.active.token, game: g.n, found: L.found.map(f => f.id) });
      if (!res.ok) return msg($('#dm'), 'bad', res.message);
      res.shown.forEach(s => { items[s.id] = Object.assign({}, items[s.id], { res: 'shown', answer: s.answer }); });
      savePlay(play); draw(); msg($('#dm'), 'info', 'Оставшиеся отличия обведены пунктиром.');
    } catch (err) { netFail($('#dm'), err); }
  }
  draw();
};

/* 6, 7: выбор из вариантов («Лишний гость», «Продолжи узор») */
ENGINES.choice = function (stage, g, st, play) {
  const items = st.items;
  const L = play.local;
  if (L.idx == null) { L.idx = 0; L.answered = {}; savePlay(play); }
  if (!L.shuffle) { L.shuffle = {}; g.questions.forEach(q => { const o = q.options.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } L.shuffle[q.id] = o; }); savePlay(play); }
  function optView(q, code) { const p = parsePattern(q.pattern); return p ? patternPiece(p.kind, code) : `<span>${esc(code)}</span>`; }
  function draw() {
    const q = g.questions[L.idx];
    const a = L.answered[q.id]; // ответ в этой попытке
    const it = items[q.id];
    const p = parsePattern(q.pattern);
    const prior = it.res && !a ? `<div class="msg info">${it.res === 'ok' ? 'Этот вопрос уже засчитан ✓' : 'Этот вопрос уже оценён.'} Сейчас — для удовольствия.</div>` : '';
    stage.innerHTML = `<div class="card">
      <div class="progress-dots">${g.questions.map((x, i) => `<i class="${i === L.idx ? 'cur' : (L.answered[x.id] || items[x.id].res) ? 'on' : ''}"></i>`).join('')}</div>
      <p class="muted" style="text-align:center;margin:0">${esc(q.text)} · ${L.idx + 1} из ${g.questions.length}</p>
      ${p ? `<div class="seq">${p.seq.map(c => patternPiece(p.kind, c)).join('')}<span class="qm" aria-label="что дальше?">?</span></div>` : ''}
      ${prior}
      <div class="opts">${L.shuffle[q.id].map(o => { let cls = ''; if (a) { if (o === a.right) cls = 'right'; else if (o === a.value) cls = 'wrong'; } return `<button class="opt ${cls}" data-o="${esc(o)}" ${a ? 'disabled' : ''}>${optView(q, o)}</button>`; }).join('')}</div>
      <div id="cm">${a ? `<div class="msg ${a.correct ? 'ok' : 'bad'}">${a.correct ? 'Верно!' : 'Не совсем.'}${a.practice ? '' : a.correct ? ' +' + a.pts + ' б.' : ''}</div>${a.explanation ? `<p>${esc(a.explanation)}</p>` : ''}` : ''}</div>
      ${a ? (L.idx < g.questions.length - 1 ? `<button class="btn wide" id="cnext">Дальше</button>` : `<button class="btn wide" id="cfin">Зажечь огонёк</button>`) : ''}
    </div>`;
    $$('.opt', stage).forEach(b => b.onclick = () => choose(q, b.dataset.o));
    const nx = $('#cnext', stage); if (nx) nx.onclick = () => { L.idx++; savePlay(play); draw(); };
    const fn = $('#cfin', stage); if (fn) fn.onclick = () => { const right = g.questions.filter(x => items[x.id].res === 'ok').length; finishAttempt({}, 'с первого раза верно: ' + right + ' из ' + g.questions.length); };
  }
  async function choose(q, value) {
    $$('.opt', stage).forEach(b => b.disabled = true);
    msg($('#cm'), 'info', 'Проверяем…');
    try {
      const res = await sendAnswer(q.id, value, uid());
      if (!res.ok) { $$('.opt', stage).forEach(b => b.disabled = false); return msg($('#cm'), 'bad', res.message); }
      items[q.id] = res.item;
      L.answered[q.id] = { value, correct: res.correct, right: res.right, explanation: res.explanation, practice: res.practice, pts: res.item.pts };
      savePlay(play); draw();
    } catch (err) { $$('.opt', stage).forEach(b => b.disabled = false); netFail($('#cm'), err); }
  }
  draw();
};

/* 8: филворд — касание первой и последней буквы или проведение пальцем */
ENGINES.words = function (stage, g, st, play) {
  const grid = (g.data && g.data.grid) || [];
  const R = grid.length, Cn = R ? Array.from(grid[0]).length : 0;
  const cells = grid.map(r => Array.from(r));
  const items = st.items;
  const L = play.local; L.found = L.found || []; // [{id,r1,c1,r2,c2}]
  let start = null, dragEnd = null, dragging = false;
  const wordOf = q => q.text;
  const isFound = id => L.found.some(f => f.id === id) || (items[id] && items[id].res === 'ok');
  function pathCells(a, b) {
    if (!a || !b) return [];
    if (a.r === b.r && b.c >= a.c) return Array.from({ length: b.c - a.c + 1 }, (_, i) => [a.r, a.c + i]);
    if (a.c === b.c && b.r >= a.r) return Array.from({ length: b.r - a.r + 1 }, (_, i) => [a.r + i, a.c]);
    return [];
  }
  function locate(word) {
    for (let r = 0; r < R; r++) for (let c = 0; c < Cn; c++) {
      if (cells[r].slice(c, c + word.length).join('') === word) return { r1: r, c1: c, r2: r, c2: c + word.length - 1 };
      let v = ''; for (let i = 0; i < word.length && r + i < R; i++) v += cells[r + i][c];
      if (v === word) return { r1: r, c1: c, r2: r + word.length - 1, c2: c };
    }
    return null;
  }
  function foundCells() {
    const set = new Set();
    g.questions.forEach(q => { if (!isFound(q.id)) return; const f = L.found.find(x => x.id === q.id) || locate(wordOf(q)); if (f) pathCells({ r: f.r1, c: f.c1 }, { r: f.r2, c: f.c2 }).forEach(([r, c]) => set.add(r + ',' + c)); });
    return set;
  }
  function hintedCells() { const s = new Set(); g.questions.forEach(q => { if (items[q.id] && items[q.id].h && !isFound(q.id)) { const p = locate(wordOf(q)); if (p) s.add(p.r1 + ',' + p.c1); } }); return s; }
  function draw() {
    const fc = foundCells(), hc = hintedCells();
    const pc = new Set(pathCells(start, dragEnd).map(x => x.join(',')));
    const all = g.questions.every(q => isFound(q.id));
    stage.innerHTML = `<div class="card">
      <div class="wgrid" id="wg">${cells.map((row, r) => row.map((ch, c) => { const k = r + ',' + c; return `<button class="cell ${fc.has(k) ? 'found' : ''} ${start && start.r === r && start.c === c ? 'sel' : ''} ${pc.has(k) ? 'path' : ''} ${hc.has(k) ? 'hinted' : ''}" data-r="${r}" data-c="${c}" aria-label="${ch}, строка ${r + 1}, столбец ${c + 1}">${ch}</button>`; }).join('')).join('')}</div>
      <div class="words">${g.questions.map(q => `<span class="word ${isFound(q.id) ? 'found' : ''}">${esc(q.text)}${!isFound(q.id) && !(items[q.id] && items[q.id].h) ? ` <button class="btn ghost small" style="min-height:32px;padding:0 4px" data-wh="${q.id}" aria-label="Подсказка к слову ${esc(q.text)}">подсказка −1</button>` : ''}</span>`).join('')}</div>
      <div id="wm"></div>
      ${all ? '<button class="btn wide" id="wfin">Зажечь огонёк</button>' : '<button class="btn sec wide" id="wstop">Завершить с найденными</button>'}
    </div>`;
    const wg = $('#wg', stage);
    wg.addEventListener('pointerdown', e => { const t = e.target.closest('.cell'); if (!t) return; e.preventDefault(); dragging = true; const p = { r: +t.dataset.r, c: +t.dataset.c }; if (start && !(start.r === p.r && start.c === p.c)) { dragging = false; complete(start, p); return; } start = p; dragEnd = p; draw(); });
    wg.addEventListener('pointermove', e => { if (!dragging) return; const el = document.elementFromPoint(e.clientX, e.clientY); const t = el && el.closest && el.closest('.cell'); if (!t) return; const p = { r: +t.dataset.r, c: +t.dataset.c }; if (!dragEnd || p.r !== dragEnd.r || p.c !== dragEnd.c) { dragEnd = p; $$('.cell', wg).forEach(b => b.classList.toggle('path', pathCells(start, dragEnd).some(([r, c]) => r === +b.dataset.r && c === +b.dataset.c))); } });
    wg.addEventListener('pointerup', () => { if (!dragging) return; dragging = false; if (dragEnd && start && !(dragEnd.r === start.r && dragEnd.c === start.c)) complete(start, dragEnd); });
    $$('[data-wh]', stage).forEach(b => b.onclick = () => inlineConfirm(b, 'Подсветить первую букву слова? За него будет 1 балл вместо 2.', () => hint(b.dataset.wh)));
    const fin = $('#wfin', stage); if (fin) fin.onclick = () => finishAttempt({ found: L.found }, 'найдено слов: ' + g.questions.filter(q => isFound(q.id)).length + ' из ' + g.questions.length);
    const stop = $('#wstop', stage); if (stop) stop.onclick = () => inlineConfirm(stop, 'Завершить сейчас? Ненайденные слова можно будет добрать при повторе.', () => finishAttempt({ found: L.found, stop: true }, 'найдено слов: ' + g.questions.filter(q => isFound(q.id)).length + ' из ' + g.questions.length));
  }
  function complete(a, b) {
    let p = pathCells(a, b);
    if (!p.length) { const rev = pathCells(b, a); if (rev.length) { p = rev; [a, b] = [b, a]; } }
    const text = p.map(([r, c]) => cells[r][c]).join('');
    const q = g.questions.find(x => x.text === text && !isFound(x.id));
    start = null; dragEnd = null;
    if (q && p.length) { L.found.push({ id: q.id, r1: a.r, c1: a.c, r2: b.r, c2: b.c }); savePlay(play); draw(); msg($('#wm'), 'ok', 'Найдено слово ' + q.text + '!'); }
    else { draw(); msg($('#wm'), 'bad', p.length ? 'Такого слова в списке нет. Попробуйте ещё.' : 'Слова читаются только слева направо или сверху вниз.'); }
  }
  async function hint(id) {
    try { const res = await askHint(id); if (!res.ok) return msg($('#wm'), 'bad', res.message); items[id] = res.item; draw(); msg($('#wm'), 'info', 'Первая буква подсвечена оранжевой рамкой.'); }
    catch (err) { netFail($('#wm'), err); }
  }
  draw();
};

/* 9: лабиринт */
ENGINES.maze = function (stage, g, st, play) {
  const d = g.data; const rows = d.rows; const H = rows.length, W = rows[0].length;
  const L = play.local;
  if (!L.pos) { L.pos = d.start.slice(); L.moves = ''; L.trail = [d.start.slice()]; savePlay(play); }
  const CS = 40, PAD = 4;
  const MOV = { U: [1, -1, 0, '↑'], R: [2, 0, 1, '→'], D: [4, 1, 0, '↓'], L: [8, 0, -1, '←'] };
  function svg() {
    let s = `<svg viewBox="0 0 ${W * CS + PAD * 2} ${H * CS + PAD * 2}" aria-label="Карта лабиринта: кораблик в клетке ${L.pos[0] + 1}-${L.pos[1] + 1}, маяк в правом верхнем углу">`;
    s += `<rect width="100%" height="100%" fill="#D5EAF0"/>`;
    const tr = L.trail.map(([y, x]) => `${PAD + x * CS + CS / 2},${PAD + y * CS + CS / 2}`).join(' ');
    s += `<polyline points="${tr}" fill="none" stroke="${C.o}" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>`;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const v = parseInt(rows[y][x], 16), X = PAD + x * CS, Y = PAD + y * CS;
      const line = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.n}" stroke-width="5" stroke-linecap="round"/>`;
      if (!(v & 1)) s += line(X, Y, X + CS, Y);
      if (!(v & 8)) s += line(X, Y, X, Y + CS);
      if (y === H - 1 && !(v & 4)) s += line(X, Y + CS, X + CS, Y + CS);
      if (x === W - 1 && !(v & 2)) s += line(X + CS, Y, X + CS, Y + CS);
    }
    const fx = PAD + d.finish[1] * CS, fy = PAD + d.finish[0] * CS;
    s += `<g transform="translate(${fx + 4} ${fy + 2}) scale(.5)">${ICONS.mayak}</g>`;
    const bx = PAD + L.pos[1] * CS, by = PAD + L.pos[0] * CS;
    s += `<g id="boat" transform="translate(${bx + 4} ${by + 4}) scale(.5)">${ICONS.boat}</g>`;
    return s + '</svg>';
  }
  function draw() {
    stage.innerHTML = `<div class="card"><div class="maze-box" id="mz">${svg()}</div>
      <div class="pad" role="group" aria-label="Управление корабликом"><button class="up" data-m="U" aria-label="Вверх">↑</button><button class="left" data-m="L" aria-label="Влево">←</button><button class="down" data-m="D" aria-label="Вниз">↓</button><button class="right" data-m="R" aria-label="Вправо">→</button></div>
      <p class="muted" style="text-align:center">Шагов: ${L.moves.length} · можно также касаться соседней клетки или нажимать стрелки на клавиатуре</p>
      <button class="btn ghost" id="mreset">Начать сначала</button></div>`;
    $$('.pad button', stage).forEach(b => b.onclick = () => move(b.dataset.m));
    $('#mreset', stage).onclick = () => { L.pos = d.start.slice(); L.moves = ''; L.trail = [d.start.slice()]; savePlay(play); draw(); };
    $('#mz', stage).onclick = e => {
      const r = $('#mz svg', stage).getBoundingClientRect();
      const x = Math.floor(((e.clientX - r.left) * (W * CS + PAD * 2) / r.width - PAD) / CS), y = Math.floor(((e.clientY - r.top) * (H * CS + PAD * 2) / r.height - PAD) / CS);
      const dy = y - L.pos[0], dx = x - L.pos[1];
      const m = dy === -1 && dx === 0 ? 'U' : dy === 1 && dx === 0 ? 'D' : dx === 1 && dy === 0 ? 'R' : dx === -1 && dy === 0 ? 'L' : null;
      if (m) move(m);
    };
  }
  function move(m) {
    if (L.done) return;
    const [bit, dy, dx] = MOV[m];
    const v = parseInt(rows[L.pos[0]][L.pos[1]], 16);
    if (!(v & bit)) { const b = $('#mz', stage); b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); return; }
    L.pos = [L.pos[0] + dy, L.pos[1] + dx]; L.moves += m; L.trail.push(L.pos.slice()); savePlay(play);
    if (L.pos[0] === d.finish[0] && L.pos[1] === d.finish[1]) { L.done = true; draw(); setTimeout(() => finishAttempt({ moves: L.moves }, 'дошли за ' + L.moves.length + ' шагов'), 400); return; }
    $('#mz', stage).innerHTML = svg();
    const p = $('.muted', stage); if (p) p.firstChild.textContent = 'Шагов: ' + L.moves.length + ' · можно также касаться соседней клетки или нажимать стрелки на клавиатуре';
  }
  const keyH = e => { if (!S.game || S.game.n !== g.n || !$('#mz')) { document.removeEventListener('keydown', keyH); return; } const m = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R' }[e.key]; if (m) { e.preventDefault(); move(m); } };
  document.addEventListener('keydown', keyH);
  draw();
};

/* 11: танцующие гномики */
ENGINES.gnomes = function (stage, g) {
  const list = (g.data && g.data.gnomes) || [];
  const demo = !list.some(x => x.photo);
  function draw(sayIdx) {
    stage.innerHTML = `<div class="card">
      ${demo ? '<div class="msg warn">ДЕМО-ПЕРСОНАЖИ. Позже здесь будут гномики-сотрудники HR (только с их согласия).</div>' : ''}
      <div class="gnomes">${list.map((x, i) => `<button class="gnome" data-i="${i}" aria-label="${esc(x.label)}">${gnomeSvg(i, x.photo)}<div class="lb">${esc(x.label)}</div><div class="bubble" ${sayIdx === i || sayIdx === 'all' ? '' : 'hidden'}>${esc(x.phrase)}</div></button>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn sec" id="gall">Все вместе!</button><button class="btn" id="gbow">Поклониться в ответ</button></div></div>`;
    $$('.gnome', stage).forEach(b => b.onclick = () => dance(Number(b.dataset.i)));
    $('#gall', stage).onclick = () => { draw('all'); $$('.gnome', stage).forEach((b, i) => b.classList.add('dance-' + (list[i].dance || 'sway'))); };
    $('#gbow', stage).onclick = () => finishAttempt({}, 'посмотрел(а) гномиков');
  }
  function dance(i) { draw(i); const b = $$('.gnome', stage)[i]; b.classList.add('dance-' + (list[i].dance || 'sway')); }
  draw();
};

/* 12: письмо в бутылке */
ENGINES.bottle = function (stage, g) {
  const wishes = (g.data && g.data.wishes) || [];
  const n = (g.data && g.data.bottles) || 5;
  const seenKey = pkey('wishes');
  let opened = null;
  function pick() {
    let seen = store.get(seenKey, []);
    let pool = wishes.map((_, i) => i).filter(i => !seen.includes(i));
    if (!pool.length) { seen = []; pool = wishes.map((_, i) => i); }
    const i = pool[Math.floor(Math.random() * pool.length)];
    seen.push(i); store.set(seenKey, seen);
    return wishes[i];
  }
  function draw() {
    stage.innerHTML = `<div class="card">
      <div class="sea">${Array.from({ length: n }, (_, i) => `<button class="bottle ${opened && opened.i === i ? 'opened' : ''}" data-i="${i}" aria-label="Бутылка ${i + 1}">${bottleSvg(i)}</button>`).join('')}</div>
      ${opened ? `<div class="letter"><div class="beam"></div>${esc(opened.text)}</div><div class="row"><button class="btn" id="bfin">Зажечь огонёк</button><button class="btn sec" id="bmore">Открыть ещё одну</button></div>` : '<p class="muted" style="margin-top:10px">Выберите бутылку.</p>'}
    </div>`;
    $$('.bottle', stage).forEach(b => b.onclick = () => { opened = { i: Number(b.dataset.i), text: pick() }; draw(); });
    const f = $('#bfin', stage); if (f) f.onclick = () => finishAttempt({}, 'открыл(а) письмо');
    const m = $('#bmore', stage); if (m) m.onclick = () => { opened = null; draw(); };
  }
  draw();
};

/* ================= Глобальные действия ================= */
function logout() {
  S.active = null; S.me = null; store.del('active'); ribbons();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-slug]');
  if (!t) return;
  if (t.dataset.slug) { e.preventDefault(); return go({ name: 'game', slug: t.dataset.slug }); }
  if (t.dataset.go) { e.preventDefault(); if (t.dataset.go === 'home') refreshInit().then(() => go({ name: 'home' })); else go({ name: t.dataset.go }); return; }
  const a = t.dataset.act;
  if (a === 'rules') { show(rulesHtml(false) + '<button class="btn wide" data-go="home">Все огни</button>'); }
  if (a === 'motion') { S.rm = !S.rm; store.set('rm', S.rm); ribbons(); }
  if (a === 'flush') flushOutbox().then(() => { if (S.route.name === 'progress') renderProgress(); });
  if (a === 'refresh') refreshInit().then(renderProgress);
  if (a === 'again') newAttempt();
  if (a === 'switch') {
    const name = S.active ? S.active.name : '';
    show(`<section class="card"><h2>Сменить участника?</h2><p>Сейчас играет: <b>${esc(name)}</b>.</p><p>Результаты сохранены на сервере. Чтобы вернуться, понадобится личный код${S.me && S.me.code ? ' <b>' + esc(S.me.code) + '</b>' : ''} — запишите его.</p>${S.active && outbox.pendingFor(S.active.pid).length ? '<div class="msg warn">Есть неотправленные результаты — они всё равно отправятся, как только появится связь.</div>' : ''}<div class="row"><button class="btn" id="swYes">Да, это не я</button><button class="btn sec" data-go="home">Отмена</button></div></section>`);
    $('#swYes').onclick = () => { logout(); go({ name: 'register' }); };
  }
});
$('#btnProgress').onclick = () => refreshInit().then(() => go({ name: 'progress' }, false));

async function refreshInit() {
  try {
    const res = await call({ action: 'init', token: S.active && S.active.token }, { tries: 1 });
    if (res.ok) {
      S.event = res.event; S.games = res.games;
      if (res.tokenInvalid) logout(); else S.me = res.me;
      store.set(pkey('init'), { event: res.event, games: res.games, me: res.me });
    }
  } catch (e) {
    const c = store.get(pkey('init'), null);
    if (c && !S.games.length) { S.event = c.event; S.games = c.games; S.me = c.me; }
  }
  ribbons();
}

/* ================= Запуск ================= */
async function boot() {
  ribbons();
  if (GAS) {
    await new Promise(res => { try { google.script.url.getLocation(loc => { const g = loc && loc.parameter && loc.parameter.g; S.route = g ? { name: 'game', slug: String(g).toLowerCase() } : { name: 'home' }; res(); }); } catch (e) { res(); } });
  } else S.route = parseRoute();
  try { await refreshInit(); }
  catch (e) { }
  if (!S.event && !S.games.length) {
    if (!GAS && !DEMO && !API_OK) return show(`<div class="card"><h2>Сайт ещё не подключён</h2><p>Организатору: откройте файл index.html и вставьте адрес веб-приложения Apps Script в строку <code>apiUrl</code>. Подробности — в инструкции по запуску.</p></div>`);
    if (S.route.name !== 'game') return show(`<div class="card"><h2>Нет связи</h2><p>Не получилось связаться с сервером квеста. Проверьте интернет и обновите страницу.</p><button class="btn" onclick="location.reload()">Обновить</button></div>`);
  }
  render();
  flushOutbox();
}
window.MAYAK = { S, call, bayScene, flushOutbox, outbox, goGame: slug => go({ name: 'game', slug: String(slug).toLowerCase() }) };
boot();
})();
</script>
